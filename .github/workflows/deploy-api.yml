name: Build and Push API Image

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'visionindex-frontend' }}
  IMAGE_TAG_PREFIX: ${{ vars.IMAGE_TAG_PREFIX || 'fieldcastops-backend' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspace apps/api
      - run: npm run build:api

  docker:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name != 'pull_request' }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        shell: bash
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME as a GitHub repository/environment variable or secret."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Set DOCKERHUB_TOKEN as a GitHub environment secret named production, or as a repository secret."
            exit 1
          fi
          if [[ "${DOCKERHUB_USERNAME}" == *"@"* ]]; then
            echo "::error::DOCKERHUB_USERNAME must be your Docker Hub username, not your email address."
            exit 1
          fi
          if [[ "${DOCKERHUB_TOKEN}" == Bearer* || "${DOCKERHUB_TOKEN}" == *" "* ]]; then
            echo "::error::DOCKERHUB_TOKEN must be the raw Docker Hub access token only. Do not include 'Bearer' or spaces."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ env.IMAGE_TAG_PREFIX }}-latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ env.IMAGE_TAG_PREFIX }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
