name: Build and Push API Image

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'visionindex-frontend' }}
  IMAGE_TAG_PREFIX: ${{ vars.IMAGE_TAG_PREFIX || 'fieldcastops-backend' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspace apps/api
      - run: npm run build:api

  docker:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name != 'pull_request' }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME as a GitHub repository/environment variable or secret."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Set DOCKERHUB_TOKEN as a GitHub environment secret named production, or as a repository secret."
            exit 1
          fi
          if [[ "${DOCKERHUB_USERNAME}" == *"@"* ]]; then
            echo "::error::DOCKERHUB_USERNAME must be your Docker Hub username, not your email address."
            exit 1
          fi
          if printf '%s' "${DOCKERHUB_USERNAME}" | grep -q '[[:space:]]'; then
            echo "::error::DOCKERHUB_USERNAME contains whitespace. Re-save the variable with only the Docker Hub username."
            exit 1
          fi
          if printf '%s' "${DOCKERHUB_TOKEN}" | grep -q '[[:space:]]'; then
            echo "::error::DOCKERHUB_TOKEN contains whitespace or a newline. Re-create/re-save the secret with only the raw token."
            exit 1
          fi
          if [[ ! "${DOCKERHUB_USERNAME}" =~ ^[a-z0-9][a-z0-9_-]{2,29}$ ]]; then
            echo "::error::DOCKERHUB_USERNAME must be the Docker Hub username/id, for example sabbas-ctrl, not a display name or email."
            exit 1
          fi
          if [[ "${DOCKERHUB_TOKEN}" == Bearer* || "${DOCKERHUB_TOKEN}" == Basic* || "${DOCKERHUB_TOKEN}" == Token* ]]; then
            echo "::error::DOCKERHUB_TOKEN must be the raw Docker Hub access token only. Do not include auth prefixes."
            exit 1
          fi

          response="$(curl -fsS -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg username "${DOCKERHUB_USERNAME}" --arg password "${DOCKERHUB_TOKEN}" '{username:$username,password:$password}')" \
            || true)"

          dockerhub_login_token="$(printf '%s' "${response}" | jq -r '.token // empty' 2>/dev/null || true)"

          if [ -z "${dockerhub_login_token}" ]; then
            echo "::error::Docker Hub rejected DOCKERHUB_USERNAME/DOCKERHUB_TOKEN. Use a Docker Hub access token with read/write permission."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ env.IMAGE_TAG_PREFIX }}-latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ env.IMAGE_TAG_PREFIX }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
